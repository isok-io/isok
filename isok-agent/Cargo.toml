[package]
name = "isok-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
isok-data = { path = "../isok-data" }
async-trait = "0.1.86"
reqwest = { version = "0.12.12", features = ["json"] }
tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "rt",
] }
serde = { version = "1.0.218", features = ["derive"] }
figment = { version = "0.10.19", features = ["yaml"] }
serde_yaml = "0.9.34+deprecated"
clap = { version = "4.5.31", features = ["derive", "env"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
dashmap = "6.1.0"
enum_dispatch = { version = "0.3.13" }
prost = "0.13.5"
thiserror = "2.0.11"
eyre = "0.6.12"
tonic = "0.12.3"
rand = "0.9.0"
hickory-resolver = { version = "0.24.4", features = ["dns-over-https-rustls"] }
rustls = { version = "0.23.23" }
rustls-native-certs = { version = "0.8.1" }
webpki-roots = { version = "0.26.8" }
x509-parser = { version = "0.17.0" }
prost-types = { version = "0.13.5" }

[dev-dependencies]
pretty_assertions = { version = "1.4.1" }
tower = "0.5.2"
hyper-util = "0.1.10"
