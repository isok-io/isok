[package]
name = "isok-api"
version = "0.1.0"
edition = "2024"

[dependencies]
isok-data = { path = "../isok-data" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower-http = { version = "0.6.2", features = ["trace"] }
thiserror = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
sqlx = { version = "0.8.5", default-features = false, features = ["macros", "postgres", "runtime-tokio", "uuid", "chrono"] }
argon2 = { version = "0.5.3", features = ["std"] }
figment = { workspace = true }
clap = { workspace = true }
aide = { version = "0.14.2", features = ["axum", "axum-json", "axum-matched-path", "axum-original-uri", "axum-query", "axum-tokio", "redoc", "swagger"] }
biscuit-auth = "5.0.0"